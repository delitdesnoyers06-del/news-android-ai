name: Android CI

on: [push, pull_request]
jobs:
  validation:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  lint:
    name: Run Lint Checks
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Lint
        run: bash ./gradlew lint

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Unit tests
        run: bash ./gradlew test --stacktrace

  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: 21
      # Pinned to explicit variants: the `ml` flavor dimension means a bare `assembleDev`
      # would build four variants and there is no longer a `dev/debug` output directory.
      # mlNone is the F-Droid/oss artifact and must stay byte-identical to the pre-AI build.
      - name: Build debug APK (no AI)
        run: bash ./gradlew assembleDevMlNoneDebug --stacktrace
      # arm64-v8a only: the mlGemma native runtimes (LiteRT, MediaPipe, sherpa-onnx) dominate the
      # APK size, and a two-ABI debug build overruns the Actions artifact storage quota. Real
      # devices are arm64; drop x86_64 (emulator-only) for the uploaded artifact.
      - name: Build debug APK (on-device AI)
        run: bash ./gradlew assembleDevMlGemmaDebug -PmlGemmaAbi=arm64-v8a --stacktrace
      - name: Upload APK (no AI)
        uses: actions/upload-artifact@v7
        with:
          name: app-dev-mlNone-debug
          path: News-Android-App/build/outputs/apk/devMlNone/debug/News-Android-App-dev-mlNone-debug.apk
          retention-days: 14
          compression-level: 9
      - name: Upload APK (on-device AI)
        uses: actions/upload-artifact@v7
        with:
          name: app-dev-mlGemma-debug
          path: News-Android-App/build/outputs/apk/devMlGemma/debug/News-Android-App-dev-mlGemma-debug.apk
          retention-days: 14
          compression-level: 9

  release-apk:
    name: Generate signed release APK
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: 21
      # Decodes the base64 keystore from the SIGNING_KEYSTORE_BASE64 secret into a file and points
      # the build at it. When the secret is unset the release APK is built unsigned instead of
      # failing, so CI stays green until the secrets are added in repo Settings → Secrets.
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release APK will be signed."
          else
            echo "SIGNING_KEYSTORE_BASE64 secret not set; building an unsigned release APK."
          fi
      # Release builds are minified (R8) and arm64-v8a only, so they stay well under the quota.
      - name: Build release APK (no AI + on-device AI)
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: bash ./gradlew assembleDevMlNoneRelease assembleDevMlGemmaRelease -PmlGemmaAbi=arm64-v8a --stacktrace
      - name: Upload release APK (no AI)
        uses: actions/upload-artifact@v7
        with:
          name: app-dev-mlNone-release
          path: News-Android-App/build/outputs/apk/devMlNone/release/*.apk
          retention-days: 14
          compression-level: 9
      - name: Upload release APK (on-device AI)
        uses: actions/upload-artifact@v7
        with:
          name: app-dev-mlGemma-release
          path: News-Android-App/build/outputs/apk/devMlGemma/release/*.apk
          retention-days: 14
          compression-level: 9
