name: CodeQL

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:

# CodeQL scanned fine but failed to upload its SARIF ("Resource not accessible by integration")
# because a workflow with no permissions block inherits a read-only token. Grant the writes the
# upload needs; keep everything else least-privilege.
permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
      - name: Build debug APK
        run: bash ./gradlew assembleDevMlGemmaDebug
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
